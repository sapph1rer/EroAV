[package]
name = "eroav"
version = "0.1.0"
edition = "2024"
default-run = "eroav"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
egui = "0.36"
egui-phosphor = "0.14"
# the player from the sibling `rmp` workspace (libmpv), same as waku-app
rmp-egui = { path = "../rmp/crates/rmp-egui" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# eroav-browser: hidden WebView2 window that passes Cloudflare (copied from waku-browser)
[target.'cfg(windows)'.dependencies]
wry = "0.57"
tao = "0.37"

[profile.dev.package."*"]
opt-level = 2
